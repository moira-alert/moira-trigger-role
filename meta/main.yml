galaxy_info:

  author: moira-alert
  description: Ansible role to create, update and delete Moira triggers
  company: SKB Kontur
  license: MIT

  # Explicitly declare the FQCN of the published role
  # (https://galaxy.ansible.com/moira-alert/moira-trigger-role).
  namespace: moira-alert
  role_name: moira-trigger-role

  # FQCNs (ansible.builtin.*), module DOCUMENTATION 'elements' and the
  # python3-only moira-python-client require a modern control node.
  min_ansible_version: 2.10

  platforms:
    - name: Ubuntu
      versions:
        - all
    - name: EL
      versions:
        - 7

  galaxy_tags:
    - moira
    - monitoring
    - alerting
    - graphite

dependencies: []
